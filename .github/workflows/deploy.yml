name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://api-java-tdb.labs-lcs-server.com
          VITE_ML_URL: https://api-ml-tdb.labs-lcs-server.com
        run: npm run build

      - name: Deploy static files
        run: rsync -a --delete dist/ /var/www/Tech_do_Bem_Frontend/dist/
